spring:
  application:
    name: securetaskapi


  datasource:
    url: jdbc:postgresql://localhost:5432/securetaskdb
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
